version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cineleta-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cineleta_password123
      POSTGRES_DB: cineleta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    container_name: cineleta-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cineleta
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=cineleta_password123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata: